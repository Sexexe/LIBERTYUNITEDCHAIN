<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lunar Odyssey</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;position:fixed;top:0;left:0;background:#000;font-family:-apple-system,system-ui,sans-serif;color:#cfe8ff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

  #hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:10;background:rgba(0,0,0,.8);padding:12px 16px;border-radius:10px;border:1px solid rgba(157,216,255,.3);font-size:12px;line-height:1.7;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:240px}
  #hud b{color:#9fd8ff;letter-spacing:1.5px;font-size:13px}
  #region{color:#ffd77f}

  .moon-btn {
    position: fixed;
    right: max(20px, env(safe-area-inset-right));
    z-index: 20;
    background: linear-gradient(135deg, rgba(180,180,190,0.85), rgba(120,120,135,0.85));
    color: #f0f4ff;
    border: 1px solid rgba(220,225,240,0.35);
    padding: 14px 26px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    touch-action: manipulation;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 4px 16px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 -1px 0 rgba(0,0,0,0.2);
    transition: all 0.2s;
    min-width: 160px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .moon-btn:hover {
    background: linear-gradient(135deg, rgba(200,200,210,0.95), rgba(140,140,155,0.95));
  }
  .moon-btn:active { transform: scale(0.96); }
  .moon-btn.active {
    background: linear-gradient(135deg, rgba(230,235,255,0.95), rgba(170,180,210,0.95));
    color: #1a1a2a;
    border-color: rgba(255,255,255,0.7);
    box-shadow: 0 4px 24px rgba(180,210,255,0.6);
    text-shadow: none;
  }
  .moon-btn.playing {
    background: linear-gradient(135deg, rgba(230,220,200,0.95), rgba(180,160,130,0.9));
    color: #2a1f10;
    border-color: rgba(255,230,180,0.7);

  }
  #turbo { bottom: max(20px, env(safe-area-inset-bottom)); }
  #music { bottom: max(80px, env(safe-area-inset-bottom)); }

  #crosshair{position:fixed;top:50%;left:50%;width:4px;height:4px;background:rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;box-shadow:0 0 6px rgba(157,216,255,.5)}
  #overlay{position:fixed;inset:0;background:radial-gradient(circle,#111 0%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer;transition:opacity 1s;padding:20px}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h2{font-size:36px;letter-spacing:6px;margin:0;color:#cfe8ff;text-align:center}
  #overlay p{color:#888;margin-top:16px;letter-spacing:2px;text-align:center;padding:0 20px;font-size:11px;line-height:1.7}
  @media (max-width:768px){
    #hud{font-size:11px;padding:10px 12px;max-width:180px}

    #overlay h2{font-size:26px}
  }
</style>

<body>

<div id="overlay">
  <h2>LUNAR ODYSSEY</h2>
  <p>НАЖМИТЕ, ЧТОБЫ НАЧАТЬ</p>
  <p style="margin-top:30px;opacity:.7">
    МЫШЬ — обзор (без нажатия)<br>
    WASD — движение · SPACE — прыжок<br>
    ПКМ — ход/стоп · TURBO ×50
  </p>
</div>

<div id="hud">
  <b>◆ LUNAR ODYSSEY</b><br>
  Солнце: <span id="sun">—</span><br>
  Режим: <span id="mode">ход</span><br>
  Регион: <span id="region">—</span><br>
  <span id="speedInfo">Скорость: TURBO ×50</span>
</div>

<div id="crosshair"></div>
<button id="music" class="moon-btn">🎵 Mission Control</button>
<button id="turbo" class="moon-btn active">TURBO</button>

<audio id="radio" loop crossorigin="anonymous">
  <source src="https://ice1.somafm.com/missioncontrol-128-mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

const WORLD_SIZE = 21166;
const WORLD_HALF = WORLD_SIZE / 2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.5, 80000);
camera.position.set(0, 2, 0);

const renderer = new THREE.WebGLRenderer({antialias: !isMobile, powerPreference: 'high-performance', alpha: false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
// ===== ТЕНИ ОТКЛЮЧЕНЫ — они давали линии по граням =====
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());

/* ===== МУЗЫКА ===== */
const radio = document.getElementById('radio');
const musicBtn = document.getElementById('music');
let musicPlaying = false;
musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (musicPlaying) {
    radio.pause();
    musicBtn.classList.remove('playing');
    musicPlaying = false;
  } else {
    radio.play().then(() => {
      musicBtn.classList.add('playing');
      musicPlaying = true;
    }).catch(()=>{});
  }
});

/* ===== 8 РЕГИОНОВ ===== */
const REGIONS = [
  { id: 0, name: 'Южное нагорье',       color: '#b0b0b0' },
  { id: 1, name: 'Моря',                 color: '#7a7a90' },
  { id: 2, name: 'Равнины',              color: '#a8b0a8' },
  { id: 3, name: 'Древние кратеры',     color: '#a0a0a0' },
  { id: 4, name: 'Молодые ударные',     color: '#d8d8d8' },
  { id: 5, name: 'Вулканические купола', color: '#c0b8a8' },
  { id: 6, name: 'Тектонические разломы', color: '#909090' },
  { id: 7, name: 'Смешанный регион',    color: '#b8b8b8' }
];
const REGION_COUNT = REGIONS.length;

function regionAt(x) {
  const t = ((x + WORLD_HALF) % WORLD_SIZE + WORLD_SIZE) % WORLD_SIZE / WORLD_SIZE;
  return Math.min(REGION_COUNT - 1, Math.floor(t * REGION_COUNT));
}

/* ===== ТИПЫ КРАТЕРОВ ===== */
const CRATER_TYPES = {
  simple:       { depthRatio: 0.40, rimHeight: 0.18, floorFlat: 0.0,  centralPeak: 0.0,  terraceAmp: 0.0,  rimWidth: 0.28 },
  simpleMedium: { depthRatio: 0.34, rimHeight: 0.22, floorFlat: 0.05, centralPeak: 0.0,  terraceAmp: 0.02, rimWidth: 0.30 },
  complex:      { depthRatio: 0.20, rimHeight: 0.20, floorFlat: 0.25, centralPeak: 0.28, terraceAmp: 0.10, rimWidth: 0.30 },
  basin:        { depthRatio: 0.10, rimHeight: 0.15, floorFlat: 0.45, centralPeak: 0.15, terraceAmp: 0.12, rimWidth: 0.35 }
};

const craters = [];
const domes = [];
const faults = [];

function typeForRadius(r) {
  if (r < 50) return 'simple';
  if (r < 180) return 'simpleMedium';
  if (r < 800) return 'complex';
  return 'basin';
}

function addCrater(x, z, r, regionId) {
  const type = typeForRadius(r);
  const profile = CRATER_TYPES[type];
  let d = r * profile.depthRatio * 2;
  if (type === 'simpleMedium') {
    const boost = 1.6 + Math.random() * 0.3;
    d *= boost;
  }
  craters.push({
    x, z, r, d, type, profile, regionId,
    rimHeight: profile.rimHeight,
    floorFlat: profile.floorFlat,
    centralPeak: profile.centralPeak,
    terraceAmp: profile.terraceAmp,
    rimWidth: profile.rimWidth
  });
}

function addDome(x, z, r, height) { domes.push({ x, z, r, height }); }
function addFault(x, z, length, angle, height, width) { faults.push({ x, z, length, angle, height, width }); }

function generateCraters() {
  const counts = isMobile
    ? { highland: 1500, sea: 15, plain: 8, ancient: 150, young: 250, mixed: 400 }
    : { highland: 3800, sea: 35, plain: 15, ancient: 400, young: 750, mixed: 1200 };

  const segW = WORLD_SIZE / REGION_COUNT;

  for (let i = 0; i < counts.highland; i++) {
    const x = -WORLD_HALF + segW * Math.random();
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 100 + Math.random() * 400, 0);
  }
  for (let i = 0; i < (isMobile?8:20); i++) {
    const x = -WORLD_HALF + segW * Math.random();
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 500 + Math.random() * 1500, 0);
  }

  for (let i = 0; i < counts.sea; i++) {
    const x = -WORLD_HALF + segW * (1 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 120 + Math.random() * 150, 1);
  }
  for (let i = 0; i < (isMobile?1:3); i++) {
    const x = -WORLD_HALF + segW * (1 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 800 + Math.random() * 1500, 1);
  }

  for (let i = 0; i < counts.plain; i++) {
    const x = -WORLD_HALF + segW * (2 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 150 + Math.random() * 300, 2);
  }

  for (let i = 0; i < counts.ancient; i++) {
    const x = -WORLD_HALF + segW * (3 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 200 + Math.random() * 700, 3);
  }
  for (let i = 0; i < (isMobile?5:12); i++) {
    const x = -WORLD_HALF + segW * (3 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 1000 + Math.random() * 2000, 3);
  }

  for (let i = 0; i < counts.young; i++) {
    const x = -WORLD_HALF + segW * (4 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 150 + Math.random() * 350, 4);
  }
  for (let i = 0; i < (isMobile?4:10); i++) {
    const x = -WORLD_HALF + segW * (4 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 600 + Math.random() * 1500, 4);
  }

  const domeCount = isMobile ? 20 : 60;
  for (let i = 0; i < domeCount; i++) {
    const x = -WORLD_HALF + segW * (5 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addDome(x, z, 100 + Math.random() * 400, 30 + Math.random() * 100);
  }
  for (let i = 0; i < (isMobile?80:200); i++) {
    const x = -WORLD_HALF + segW * (5 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 100 + Math.random() * 150, 5);
  }

  const faultCount = isMobile ? 15 : 40;
  for (let i = 0; i < faultCount; i++) {
    const x = -WORLD_HALF + segW * (6 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addFault(x, z, 300 + Math.random() * 1200, Math.random() * Math.PI, 20 + Math.random() * 60, 60 + Math.random() * 100);
  }
  for (let i = 0; i < (isMobile?60:180); i++) {
    const x = -WORLD_HALF + segW * (6 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 100 + Math.random() * 180, 6);
  }

  for (let i = 0; i < counts.mixed; i++) {
    const x = -WORLD_HALF + segW * (7 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 100 + Math.random() * 250, 7);
  }
  for (let i = 0; i < (isMobile?3:8); i++) {
    const x = -WORLD_HALF + segW * (7 + Math.random());
    const z = (Math.random()-.5) * WORLD_SIZE;
    addCrater(x, z, 500 + Math.random() * 1000, 7);
  }
}

console.log('Генерация кратеров...');
generateCraters();
console.log(`Кратеров: ${craters.length}, куполов: ${domes.length}, разломов: ${faults.length}`);

/* ===== SPATIAL HASH ===== */
const CELL_SIZE = 400;
let gridCols = 0, gridRows = 0, grid = null;

function buildGrid() {
  gridCols = Math.ceil(WORLD_SIZE / CELL_SIZE);
  gridRows = Math.ceil(WORLD_SIZE / CELL_SIZE);
  grid = new Array(gridCols * gridRows);
  for (let i = 0; i < grid.length; i++) grid[i] = [];

  for (let i = 0; i < craters.length; i++) {
    const c = craters[i];
    const totalR = c.r * (1 + c.rimWidth + 0.2);
    let minCol = Math.floor((c.x - totalR + WORLD_HALF) / CELL_SIZE);
    let maxCol = Math.floor((c.x + totalR + WORLD_HALF) / CELL_SIZE);
    let minRow = Math.floor((c.z - totalR + WORLD_HALF) / CELL_SIZE);
    let maxRow = Math.floor((c.z + totalR + WORLD_HALF) / CELL_SIZE);

    for (let col = minCol; col <= maxCol; col++) {
      for (let row = minRow; row <= maxRow; row++) {
        const wc = ((col % gridCols) + gridCols) % gridCols;
        const wr = ((row % gridRows) + gridRows) % gridRows;
        grid[wc * gridRows + wr].push(c);
      }
    }
  }
}
buildGrid();

function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

const K = 2 * Math.PI / WORLD_SIZE;

function softNoise(x, z) {
  return Math.sin(x*K*1)*Math.cos(z*K*1)*12 +
         Math.sin(x*K*3+1.3)*Math.cos(z*K*3+2.1)*4 +
         Math.sin(x*K*7+0.7)*Math.cos(z*K*7+1.5)*1.2;
}

function wrappedDelta(d) {
  if (d > WORLD_HALF) d -= WORLD_SIZE;
  else if (d < -WORLD_HALF) d += WORLD_SIZE;
  return d;
}

function craterHeight(c, dx, dz) {
  const d = Math.sqrt(dx*dx + dz*dz);
  const t = d / c.r;
  if (t >= 1 + c.rimWidth + 0.2) return 0;

  let h = 0;
  if (t < c.floorFlat) {
    h -= c.d;
  } else if (t < 1) {
    const tNorm = (t - c.floorFlat) / (1 - c.floorFlat);
    const smooth = smoothstep(0, 1, tNorm);
    const smoothSq = smooth * smooth;
    h -= c.d * (1 - smoothSq * (3 - 2 * smooth));
  }
  if (c.centralPeak > 0 && t < 0.35) {
    const pf = 1 - smoothstep(0, 0.35, t);
    h += c.d * c.centralPeak * pf * pf;
  }
  if (c.terraceAmp > 0 && t > 0.3 && t < 0.95) {
    const zone = smoothstep(0.3, 0.4, t) * (1 - smoothstep(0.85, 0.95, t));
    const w = Math.sin(t * 3 * Math.PI * 2 + c.x * 0.001) * 0.5 + 0.5;
    h += c.d * c.terraceAmp * zone * (w - 0.5);
  }
  if (t > 0.95 && t < 1 + c.rimWidth) {
    const rt = (t - 1) / c.rimWidth;
    const rf = smoothstep(-0.2, 0.3, rt) * (1 - smoothstep(0.6, 1.1, rt));
    h += c.d * c.rimHeight * rf;
  }
  return h;
}

function domeHeight(dm, dx, dz) {
  const d = Math.sqrt(dx*dx + dz*dz);
  const t = d / dm.r;
  if (t >= 1) return 0;
  return dm.height * 0.5 * (1 + Math.cos(t * Math.PI));
}

function faultHeight(f, dx, dz) {
  const cos = Math.cos(f.angle);
  const sin = Math.sin(f.angle);
  const along = dx * cos + dz * sin;
  const perp = -dx * sin + dz * cos;
  if (Math.abs(along) > f.length / 2) return 0;
  const perpT = Math.abs(perp) / f.width;
  if (perpT >= 1.5) return 0;
  const s = smoothstep(-1.5, 1.5, perp / f.width);
  return f.height * (s - 0.5);
}

function computeGroundH(x, z) {
  let h = softNoise(x, z);
  const col = Math.floor((x + WORLD_HALF) / CELL_SIZE);
  const row = Math.floor((z + WORLD_HALF) / CELL_SIZE);
  const wc = ((col % gridCols) + gridCols) % gridCols;
  const wr = ((row % gridRows) + gridRows) % gridRows;
  const bucket = grid[wc * gridRows + wr];
  if (bucket) {
    for (let i = 0; i < bucket.length; i++) {
      const c = bucket[i];
      const dx = wrappedDelta(x - c.x);
      const dz = wrappedDelta(z - c.z);
      h += craterHeight(c, dx, dz);
    }
  }
  for (let i = 0; i < domes.length; i++) {
    const dm = domes[i];
    const dx = wrappedDelta(x - dm.x);
    const dz = wrappedDelta(z - dm.z);
    if (Math.abs(dx) > dm.r || Math.abs(dz) > dm.r) continue;
    h += domeHeight(dm, dx, dz);
  }
  for (let i = 0; i < faults.length; i++) {
    const f = faults[i];
    const dx = wrappedDelta(x - f.x);
    const dz = wrappedDelta(z - f.z);
    const md = f.length / 2 + f.width;
    if (Math.abs(dx) > md || Math.abs(dz) > md) continue;
    h += faultHeight(f, dx, dz);
  }
  return h;
}

/* ============================================================
   МАТЕРИАЛ БЕЗ ТЕКСТУРЫ — однотонный серый, без сетки
   ============================================================ */
const terrainRes = isMobile ? 450 : 900;
const vertsPerRow = terrainRes + 1;
const heightMap = new Float32Array(vertsPerRow * vertsPerRow);

const terrainGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE, terrainRes, terrainRes);
terrainGeo.rotateX(-Math.PI/2);
const v = terrainGeo.attributes.position;

for (let i = 0; i < v.count; i++) {
  const x = v.getX(i);
  const z = v.getZ(i);
  const y = computeGroundH(x, z);
  v.setY(i, y);
  heightMap[i] = y;
}

// Проход сглаживания
function smoothHeightMap() {
  const temp = new Float32Array(heightMap.length);
  const N = vertsPerRow;
  const last = N - 1;
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const idx = i * N + j;
      const iUp = i > 0 ? i - 1 : last;
      const iDown = i < last ? i + 1 : 0;
      const jLeft = j > 0 ? j - 1 : last;
      const jRight = j < last ? j + 1 : 0;
      let sum = heightMap[idx], cnt = 1;
      sum += heightMap[i * N + jLeft]; cnt++;
      sum += heightMap[i * N + jRight]; cnt++;
      sum += heightMap[iUp * N + j]; cnt++;
      sum += heightMap[iDown * N + j]; cnt++;
      sum += heightMap[iUp * N + jLeft]; cnt++;
      sum += heightMap[iUp * N + jRight]; cnt++;
      sum += heightMap[iDown * N + jLeft]; cnt++;
      sum += heightMap[iDown * N + jRight]; cnt++;
      temp[idx] = sum / cnt;
    }
  }
  heightMap.set(temp);
}
smoothHeightMap();

for (let i = 0; i < v.count; i++) v.setY(i, heightMap[i]);
terrainGeo.computeVertexNormals();

// Материал без текстуры — однотонный серый с лёгким отражением
const terrainMat = new THREE.MeshStandardMaterial({
  color: 0xb0b0b0,
  roughness: 0.95,
  metalness: 0.02,
  flatShading: false
});

/* ============================================================
   ОБЪЕДИНЕНИЕ 9 КОПИЙ + ПЕРЕСЧЁТ НОРМАЛЕЙ
   ============================================================ */
const mergedGeometries = [];
for (let dx = -1; dx <= 1; dx++) {
  for (let dz = -1; dz <= 1; dz++) {
    if (dx === 0 && dz === 0) {
      mergedGeometries.push(terrainGeo);
    } else {
      const geo = terrainGeo.clone();
      geo.translate(dx * WORLD_SIZE, 0, dz * WORLD_SIZE);
      mergedGeometries.push(geo);
    }
  }
}

const mergedGeo = THREE.BufferGeometryUtils.mergeBufferGeometries(mergedGeometries, false);
for (let i = 0; i < mergedGeometries.length; i++) {
  if (mergedGeometries[i] !== terrainGeo) mergedGeometries[i].dispose();
}
mergedGeo.computeVertexNormals();

const terrain = new THREE.Mesh(mergedGeo, terrainMat);
terrain.frustumCulled = false;
scene.add(terrain);

/* ===== КОЛЛИЗИЯ ===== */
const CELL_X = WORLD_SIZE / terrainRes;
const CELL_Z = WORLD_SIZE / terrainRes;

function sampleHeight(x, z) {
  x = wrappedDelta(x);
  z = wrappedDelta(z);

  const fx = (x + WORLD_HALF) / CELL_X;
  const fz = (z + WORLD_HALF) / CELL_Z;

  const x0 = Math.floor(fx);
  const z0 = Math.floor(fz);
  const tx = fx - x0;
  const tz = fz - z0;

  const x1 = (x0 + 1) % vertsPerRow;
  const z1 = (z0 + 1) % vertsPerRow;
  const x0w = ((x0 % vertsPerRow) + vertsPerRow) % vertsPerRow;
  const z0w = ((z0 % vertsPerRow) + vertsPerRow) % vertsPerRow;

  const i00 = z0w * vertsPerRow + x0w;
  const i10 = z0w * vertsPerRow + x1;
  const i01 = z1 * vertsPerRow + x0w;
  const i11 = z1 * vertsPerRow + x1;

  const h00 = heightMap[i00];
  const h10 = heightMap[i10];
  const h01 = heightMap[i01];
  const h11 = heightMap[i11];

  const a = h00 * (1 - tx) + h10 * tx;
  const b = h01 * (1 - tx) + h11 * tx;
  return a * (1 - tz) + b * tz;
}

/* ===== ЗВЁЗДЫ ===== */
function createStarTex(sizePx) {
  const c = document.createElement('canvas');
  c.width = c.height = sizePx;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(sizePx/2, sizePx/2, 0, sizePx/2, sizePx/2, sizePx/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.15, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.7, 'rgba(255,255,255,0.18)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, sizePx, sizePx);
  return new THREE.CanvasTexture(c);
}

const starTexList = [];
for (let i = 0; i < 10; i++) starTexList.push(createStarTex(32 + i*4));

function raDecToXYZ(ra_h, dec_deg, radius) {
  const ra = ra_h * 15 * Math.PI / 180;
  const dec = dec_deg * Math.PI / 180;
  return [
    radius * Math.cos(dec) * Math.cos(ra),
    radius * Math.sin(dec),
    -radius * Math.cos(dec) * Math.sin(ra)
  ];
}

function makeStarLayer(stars, sizePx, opacity, texIndex, brightMult) {
  const geo = new THREE.BufferGeometry();
  const pos = [], col = [];
  stars.forEach(([ra, dec]) => {
    const [x, y, z] = raDecToXYZ(ra, dec, 35000);
    pos.push(x, y, z);
    col.push(brightMult, brightMult, brightMult);
  });
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    size: sizePx, sizeAttenuation: false, vertexColors: true,
    map: starTexList[texIndex], transparent: true, opacity,
    alphaTest: 0.01, blending: THREE.AdditiveBlending, depthWrite: false
  }));
}

for (let layer = 0; layer < 8; layer++) {
  const count = isMobile ? 200 + layer*100 : 600 + layer*300;
  const stars = [];
  for (let i = 0; i < count; i++) {
    stars.push([Math.random()*24, Math.acos(2*Math.random()-1)*180/Math.PI-90]);
  }
  scene.add(makeStarLayer(stars, (2 + layer*1.2)/16, 0.9 - layer*0.05, layer, 5.0));
}

const faintCount = isMobile ? 10000 : 30000;
const faintStars = [];
for (let i = 0; i < faintCount; i++) {
  faintStars.push([Math.random()*24, Math.acos(2*Math.random()-1)*180/Math.PI-90]);
}
scene.add(makeStarLayer(faintStars, 1.2/16, 0.5, 0, 5.0));

/* ===== ЗЕМЛЯ ===== */
const earthTexLoader = new THREE.TextureLoader();
earthTexLoader.setCrossOrigin('anonymous');

const earthGroup = new THREE.Group();
earthGroup.position.set(1200, 1400, -3500);
scene.add(earthGroup);

const earthMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.9,
  metalness: 0.0,
  emissive: 0x0a1a33,
  emissiveIntensity: 0.15
});

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(700, isMobile ? 64 : 128, isMobile ? 48 : 96),
  earthMat
);
earthGroup.add(earth);

earthTexLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg', (tex) => {
  tex.anisotropy = isMobile ? 4 : 16;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  earthMat.map = tex;
  earthMat.needsUpdate = true;
});

const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(725, isMobile ? 32 : 64, isMobile ? 32 : 64),
  new THREE.MeshBasicMaterial({
    color: 0x66aaff, transparent: true, opacity: 0.15,
    side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false
  })
);
earthGroup.add(atmo);

/* ===== СОЛНЦЕ ===== */
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(220, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0xfffef8 })
);
scene.add(sun);

// Тени отключены — без артефактов на гранях
const sunLight = new THREE.DirectionalLight(0xfff8e8, isMobile ? 3.2 : 4.0);
sunLight.castShadow = false;
scene.add(sunLight);
scene.add(sunLight.target);

const nightLight = new THREE.DirectionalLight(0x334466, 0.15);
scene.add(nightLight);

scene.add(new THREE.HemisphereLight(0x445577, 0x0a0a15, 0.15));
scene.add(new THREE.AmbientLight(0x151825, 0.12));

const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: (() => {
    const s = 256;
    const c = document.createElement('canvas'); c.width = c.height = s;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.4, 'rgba(255,254,240,0.35)');
    g.addColorStop(0.7, 'rgba(255,250,220,0.08)');
    g.addColorStop(1, 'rgba(255,250,220,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, s, s);
    return new THREE.CanvasTexture(c);
  })(),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
sunGlow.scale.set(900, 900, 1);
scene.add(sunGlow);

/* ===== УПРАВЛЕНИЕ ===== */
const keys = {};
let yaw = 0, pitch = 0;
let velocityY = 0;
let onGround = true;
let turboMode = true;
let isWalking = true;

addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  updateMode();
  if (!isMobile) {
    renderer.domElement.requestPointerLock();
  }
  radio.play().then(() => {
    musicPlaying = true;
    musicBtn.classList.add('playing');
  }).catch(err => {
    console.warn('Радио не запустилось:', err);
  });
});

function updateMode() {
  const modeEl = document.getElementById('mode');
  modeEl.textContent = isWalking ? 'ход' : 'стоп';
  modeEl.style.color = isWalking ? '#7fff7f' : '#ff7f7f';
}

renderer.domElement.addEventListener('mousedown', e => {
  e.preventDefault();
  if (e.button === 2) {
    isWalking = !isWalking;
    updateMode();
    return;
  }
  if (document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  }
});

addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) {
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
  }
});

renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

let lastTouchX = 0, lastTouchY = 0, lastTapTime = 0, touchStartTime = 0, touchMoved = false;

renderer.domElement.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
    touchStartTime = Date.now();
    touchMoved = false;
  }
}, {passive: false});

renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - lastTouchX;
    const dy = e.touches[0].clientY - lastTouchY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) touchMoved = true;
    yaw -= dx * 0.005;
    pitch -= dy * 0.005;
    pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;
  }
}, {passive: false});

renderer.domElement.addEventListener('touchend', e => {
  e.preventDefault();
  const now = Date.now();
  const touchDuration = now - touchStartTime;
  if (!touchMoved && touchDuration < 200) {
    if (now - lastTapTime < 300) {
      isWalking = !isWalking;
      updateMode();
    }
    lastTapTime = now;
  }
}, {passive: false});

const turboBtn = document.getElementById('turbo');
turboBtn.addEventListener('click', e => {
  e.stopPropagation();
  turboMode = !turboMode;
  turboBtn.classList.toggle('active');
  document.getElementById('speedInfo').textContent = turboMode ? 'Скорость: TURBO ×50' : 'Скорость: обычная';
});

/* ===== ФИЗИКА ===== */
const LUNAR_GRAVITY = 1.62;
const JUMP_VELOCITY = 20;
const BASE_SPEED = 12;
const TURBO_MULTIPLIER = 50;
const AIR_CONTROL = 0.35;
const GROUND_FRICTION = 0.88;
const AIR_FRICTION = 0.995;

const horizVel = new THREE.Vector3();
const clock = new THREE.Clock();

const DAY_DURATION = 55;
const NIGHT_DURATION = 10;
const FULL_CYCLE = DAY_DURATION + NIGHT_DURATION;
let cycleTime = 0;
const SUN_ORBIT_RADIUS = 4000;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  cycleTime = (cycleTime + dt) % FULL_CYCLE;
  const isDay = cycleTime < DAY_DURATION;
  const phase = isDay ? cycleTime / DAY_DURATION : (cycleTime - DAY_DURATION) / NIGHT_DURATION;
  const sunAngle = isDay ? phase * Math.PI : Math.PI + phase * Math.PI;
  const sunHeight = Math.sin(sunAngle);
  const horizontalAngle = sunAngle * 0.5;

  sun.position.set(
    camera.position.x + Math.cos(horizontalAngle) * SUN_ORBIT_RADIUS,
    sunHeight * SUN_ORBIT_RADIUS,
    camera.position.z + Math.sin(horizontalAngle) * SUN_ORBIT_RADIUS
  );
  sunGlow.position.copy(sun.position);
  sunLight.position.copy(sun.position);
  sunLight.target.position.copy(camera.position);

  nightLight.position.set(-sun.position.x, -sun.position.y, -sun.position.z);
  nightLight.target = camera;

  const dayFactor = Math.max(0, sunHeight);
  sun.visible = isDay && sunHeight > -0.05;
  sunGlow.visible = sun.visible;
  sunGlow.material.opacity = dayFactor;
  sunLight.intensity = (isMobile ? 3.2 : 4.0) * (0.1 + dayFactor * 0.9);

  earth.rotation.y += dt * 0.012;

  const speed = (keys['ShiftLeft'] ? BASE_SPEED * 2 : BASE_SPEED) * (turboMode ? TURBO_MULTIPLIER : 1);
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const input = new THREE.Vector3();

  if (keys['KeyW']) input.add(forward);
  if (keys['KeyS']) input.sub(forward);
  if (keys['KeyD']) input.add(right);
  if (keys['KeyA']) input.sub(right);
  if (isWalking && input.lengthSq() === 0) input.add(forward);

  if (input.lengthSq() > 0) input.normalize().multiplyScalar(speed);

  if (onGround) {
    horizVel.x += (input.x - horizVel.x) * Math.min(1, dt * 15);
    horizVel.z += (input.z - horizVel.z) * Math.min(1, dt * 15);
    horizVel.multiplyScalar(GROUND_FRICTION);
  } else {
    horizVel.x += input.x * dt * AIR_CONTROL;
    horizVel.z += input.z * dt * AIR_CONTROL;
    horizVel.multiplyScalar(AIR_FRICTION);
    const maxAir = speed * 1.5;
    if (horizVel.length() > maxAir) horizVel.setLength(maxAir);
  }

  camera.position.x += horizVel.x * dt;
  camera.position.z += horizVel.z * dt;

  if (camera.position.x > WORLD_HALF) camera.position.x -= WORLD_SIZE;
  else if (camera.position.x < -WORLD_HALF) camera.position.x += WORLD_SIZE;
  if (camera.position.z > WORLD_HALF) camera.position.z -= WORLD_SIZE;
  else if (camera.position.z < -WORLD_HALF) camera.position.z += WORLD_SIZE;

  const prevVelocityY = velocityY;

  velocityY -= LUNAR_GRAVITY * dt;
  if (keys['Space'] && onGround) { velocityY = JUMP_VELOCITY; onGround = false; }
  camera.position.y += velocityY * dt;

  const horizSpeed = Math.hypot(horizVel.x, horizVel.z);
  const stepAhead = Math.min(horizSpeed * dt * 3, 30);
  const dirX = horizSpeed > 0.1 ? horizVel.x / horizSpeed : 0;
  const dirZ = horizSpeed > 0.1 ? horizVel.z / horizSpeed : 0;

  const hHere = sampleHeight(camera.position.x, camera.position.z);
  const hAhead = sampleHeight(
    camera.position.x + dirX * stepAhead,
    camera.position.z + dirZ * stepAhead
  );

  const gh = Math.max(hHere, hAhead) + 2;
  const lookAhead = velocityY < 0 ? velocityY * dt : 0;
  const targetY = gh - lookAhead;

  if (camera.position.y < targetY) {
    camera.position.y = targetY;
    if (velocityY < 0) velocityY = 0;
    onGround = true;
  } else {
    onGround = false;
  }

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const rid = regionAt(camera.position.x);
  const regionEl = document.getElementById('region');
  if (regionEl && regionEl.dataset.rid !== String(rid)) {
    regionEl.dataset.rid = String(rid);
    regionEl.textContent = REGIONS[rid].name;
    regionEl.style.color = REGIONS[rid].color;
  }

  document.getElementById('sun').textContent = isDay ? '▲ день' : '▼ ночь';

  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.body.addEventListener('touchmove', e => {
  if (e.target === document.body) e.preventDefault();
}, {passive: false});
</script>
